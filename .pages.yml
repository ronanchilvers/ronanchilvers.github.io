settings:
  content:
    merge: true
actions:
  - name: deploy
    label: Deploy Site
    workflow: deploy.yml
media:
  input: static
  output: /
content:
  - name: home
    label: Home Page
    type: file
    path: "content/_index.md"
    fields:
      - name: title
        label: Title
        type: string
      - &seo_title
        name: seo_title
        label: Search title (optional)
        type: string
      - &description
        name: description
        label: Search description (optional)
        type: text
      - &seo_image
        name: seo_image
        label: Social preview image (optional)
        type: image
      - &seo_image_alt
        name: seo_image_alt
        label: Social preview image description (optional)
        type: string
      - &noindex
        name: noindex
        label: Exclude from search results
        type: boolean
        default: false
      - &lastmod
        name: lastmod
        label: Last content update (optional)
        type: date
        options:
          format: yyyy-MM-dd HH:mm:ss
          time: true
      - name: body
        label: Body
        type: text
        rows: 60
  - name: about
    label: About Page
    type: file
    path: "content/about.md"
    fields:
      - name: title
        label: Title
        type: string
      - *seo_title
      - *description
      - *seo_image
      - *seo_image_alt
      - *noindex
      - *lastmod
      - name: body
        label: Body
        type: text
        options:
          rows: 60
      - name: draft
        label: Draft
        type: boolean
        default: true
  - name: projects
    label: Projects Page
    type: file
    path: "content/projects.md"
    fields:
      - name: title
        label: Title
        type: string
      - *seo_title
      - *description
      - *seo_image
      - *seo_image_alt
      - *noindex
      - *lastmod
      - name: body
        label: Body
        type: text
        options:
          rows: 60
      - name: draft
        label: Draft
        type: boolean
        default: true
  - name: posts
    label: Posts
    type: collection
    path: 'content/posts'
    filename: '{primary}.md'
    view:
      fields:
        - title
        - date
        - summary
        - draft
    exclude:
      - _index.md
    fields:
      - name: date
        label: Date
        type: date
        options:
          format: yyyy-MM-dd HH:mm:ss
          time: true
      - name: title
        label: Title
        type: string
      - name: slug
        label: Slug
        type: string
      - name: summary
        label: Summary
        type: string
      - name: draft
        label: Draft
        type: boolean
        default: true
      - name: featured
        label: Featured Article
        type: boolean
        default: false
      - name: tags
        label: Tags
        type: string
        list: true
      - name: categories
        label: Categories
        type: string
        list: true
      - *seo_title
      - *description
      - *seo_image
      - *seo_image_alt
      - *noindex
      - *lastmod
      - name: body
        label: Body
        type: text
        options:
          autoresize: false
          rows: 10
  - name: category-twelve-duchies
    label: "Category: Twelve Duchies"
    type: file
    path: "content/categories/twelve-duchies/_index.md"
    fields: &term_fields
      - name: title
        label: Display title
        type: string
      - *seo_title
      - *description
      - *seo_image
      - *seo_image_alt
      - *noindex
      - *lastmod
      - name: body
        label: Introduction
        type: text
  - name: category-mountaintop-isolation
    label: "Category: Mountaintop Isolation"
    type: file
    path: "content/categories/mountaintop-isolation/_index.md"
    fields: *term_fields
  - name: category-rules-and-tools
    label: "Category: Rules and Tools"
    type: file
    path: "content/categories/rules-and-tools/_index.md"
    fields: *term_fields
  - name: category-streetwise
    label: "Category: Streetwise"
    type: file
    path: "content/categories/streetwise/_index.md"
    fields: *term_fields
  - name: category-the-library-between-worlds
    label: "Category: The Library Between Worlds"
    type: file
    path: "content/categories/the-library-between-worlds/_index.md"
    fields: *term_fields
  - name: tag-actual-play
    label: "Tag: Actual Play"
    type: file
    path: "content/tags/actual-play/_index.md"
    fields: *term_fields
  - name: tag-encounters
    label: "Tag: Encounters"
