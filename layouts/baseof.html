<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode }}" dir="ltr">
    <head>
    {{ partial "head.html" . }}
{{ if .Site.Params.analytics.ga4_id }}
    <script async src="https://www.googletagmanager.com/gtag/js?id={{ .Site.Params.analytics.ga4_id }}"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', '{{ .Site.Params.analytics.ga4_id }}');
    </script>
{{ end }}
{{ if .Site.Params.analytics.gtm_id }}
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','{{ .Site.Params.analytics.gtm_id }}');</script>
{{ end }}
    </head>
    <body>
{{ if .Site.Params.analytics.gtm_id }}
        <noscript><iframe src="https://www.googletagmanager.com/ns.html?id={{ .Site.Params.analytics.gtm_id }}"
        height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
{{ end }}
        <header>
          {{ partial "header.html" . }}
        </header>
        <main>
            {{ block "main" . }}{{ end }}
        </main>
        <footer>
          {{ partial "footer.html" . }}
        </footer>
    </body>
</html>
