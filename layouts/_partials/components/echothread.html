{{- with .Site.Params.echothread }}
{{- if .site_key }}
{{- $identifier := $.Permalink }}
{{- with $.File }}
{{- $identifier = .UniqueID }}
{{- end }}
<section class="echothread-panel">
    <div
        class="echothread-comments"
        data-site="{{ .site_key }}"
        data-identifier="{{ $identifier }}"
        data-page-title="{{ $.Title }}"
        data-theme="{{ default "#22272e" .theme }}">
    </div>
</section>
<script src="https://cdn.echothread.io/embed.js" async></script>
{{- end }}
{{- end }}
