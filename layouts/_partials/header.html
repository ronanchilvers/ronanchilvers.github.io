<div class="site-title">
    <figure class="figure-round">
        <img src="/images/home-64x64.png" alt="" width="64" height="64" />
    </figure>
    {{ if .IsHome }}<h1 class="site-name">{{ else }}<div class="site-name">{{ end }}
        <a href="/">{{ .Site.Title }}</a>
    {{ if .IsHome }}</h1>{{ else }}</div>{{ end }}
</div>
<nav aria-labelledby="primary-navigation">
{{ range .Site.Menus.main }}
    <a href="{{ .URL | relURL }}">{{ .Name }}</a>
{{ end }}
</nav>
