<div class="site-title">
    <figure class="figure-round">
        {{- with resources.Get "images/home-64x64.png" }}
        {{- $logoWebp := .Process "webp q90" }}
        <picture>
            <source srcset="{{ $logoWebp.RelPermalink }}" type="image/webp">
            <img src="{{ .RelPermalink }}" alt="" width="{{ .Width }}" height="{{ .Height }}" />
        </picture>
        {{- end }}
    </figure>
    {{ if .IsHome }}<h1 class="site-name">{{ else }}<div class="site-name">{{ end }}
        <a href="/">{{ .Site.Title }}</a>
    {{ if .IsHome }}</h1>{{ else }}</div>{{ end }}
</div>
<nav aria-label="Primary navigation">
{{ range .Site.Menus.main }}
    <a href="{{ .URL | relURL }}">{{ .Name }}</a>
{{ end }}
</nav>
